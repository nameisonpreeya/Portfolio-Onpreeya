<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; }

  body {
    font-family: "Noto Sans Thai", sans-serif;
    padding: 24px;
    background: #f4f4f5;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 12px;
    overflow: hidden;
    cursor: zoom-in;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .card .title {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 40px 16px 14px;
    color: #fff;
    font-size: 1.1rem;
    font-weight: 600;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  }

  .card:hover img { transform: scale(1.08); }

  /* ---------- Fullscreen viewer ---------- */
  .viewer {
    position: fixed;
    inset: 0;               /* เต็มจอ */
    width: 100vw;
    height: 100vh;
    background: #000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
    z-index: 100;
  }

  .viewer.open {
    opacity: 1;
    visibility: visible;
  }

  .viewer img {
    width: 100%;
    height: 100%;
    object-fit: contain;    /* เห็นภาพครบ ไม่ถูกตัด */
    display: block;
  }

  .viewer .caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 60px 24px 24px;
    color: #fff;
    font-size: 1.5rem;
    font-weight: 600;
    text-align: center;
    background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    pointer-events: none;
  }

  .viewer button {
    position: absolute;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    font-size: 1.5rem;
    cursor: pointer;
    transition: background 0.2s;
  }

  .viewer button:hover { background: rgba(255,255,255,0.35); }

  .viewer .close { top: 20px; right: 20px; }
  .viewer .prev  { left: 20px;  top: 50%; transform: translateY(-50%); }
  .viewer .next  { right: 20px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>

<div class="gallery">
  <div class="card">
    <img src="web-3.jpg" data-full="web-3.jpg" alt="ภูเขา">
    <div class="title">Relational Schema(Chen)</div>
  </div>

  <div class="card">
    <img src="DataDic.png" data-full="DataDic.png" alt="ทะเล">
    <div class="title">Data Dictionary</div>
  </div>

</div>

<!-- Fullscreen viewer -->
<div class="viewer" id="viewer">
  <img id="viewer-img" src="" alt="">
  <div class="caption" id="viewer-caption"></div>
  <button class="close" aria-label="ปิด">✕</button>
  <button class="prev" aria-label="ก่อนหน้า">‹</button>
  <button class="next" aria-label="ถัดไป">›</button>
</div>

<script>
  const cards = document.querySelectorAll('.card');
  const viewer = document.getElementById('viewer');
  const vImg = document.getElementById('viewer-img');
  const vCaption = document.getElementById('viewer-caption');
  let current = 0;

  function show(index) {
    current = (index + cards.length) % cards.length;
    const img = cards[current].querySelector('img');
    vImg.src = img.dataset.full || img.src;
    vImg.alt = img.alt;
    vCaption.textContent = cards[current].querySelector('.title').textContent;
  }

  function openViewer(index) {
    show(index);
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden'; 
  }

  function closeViewer() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
  }

  cards.forEach((card, i) => card.addEventListener('click', () => openViewer(i)));

  viewer.querySelector('.close').addEventListener('click', closeViewer);
  viewer.querySelector('.prev').addEventListener('click', e => { e.stopPropagation(); show(current - 1); });
  viewer.querySelector('.next').addEventListener('click', e => { e.stopPropagation(); show(current + 1); });

  // คลิกที่ภาพเพื่อปิดก็ได้
  vImg.addEventListener('click', closeViewer);

  document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') closeViewer();
    if (e.key === 'ArrowLeft') show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
</script>

</body>
</html>
